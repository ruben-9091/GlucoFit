server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
 
    # Necesario para que las rutas de React Router (/login, /glucose, etc.)
    # funcionen al recargar la página o entrar directamente por URL:
    # si el archivo no existe físicamente, sirve siempre index.html
    # y deja que React Router decida qué mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }
}